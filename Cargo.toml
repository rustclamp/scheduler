[package]
name = "rustclamp-scheduler"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Contribution target for bounded, clock-driven application jobs."
repository = "https://github.com/rustclamp/scheduler"
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[features]
default = []
# Scheduler::run_until, an async tick driver (ADR 0020).
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.53.1", optional = true, default-features = false, features = ["rt", "time", "macros"] }
rustclamp-core = { version = "0.1.0", path = "../core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

